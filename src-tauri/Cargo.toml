[package]
name = "hawwwker"
version = "26.3.0"
description = "Hawwwker 货客 — AI 多平台购物搜索、比价与盯价"
authors = ["Steven Zhang"]
edition = "2021"
rust-version = "1.87"

[lib]
name = "hawwwker_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-tungstenite = "0.26"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 会话备份加密：Windows 用 DPAPI（当前用户），其他系统用 ChaCha20-Poly1305 + 本机密钥文件
[target.'cfg(not(windows))'.dependencies]
chacha20poly1305 = { version = "0.10", features = ["getrandom"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
