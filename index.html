<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Hawwwker 货客</title>
    <style>
      /* 启动前的占位：避免白屏闪烁 */
      html { background: transparent; }
      @media (prefers-color-scheme: dark) { html:not(.booted) body { background: #0b0e16; } }
      @media (prefers-color-scheme: light) { html:not(.booted) body { background: #eef1f8; } }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; }
      #boot i { width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(135deg, #3d7bff, #8a5cff); animation: b 1.2s ease-in-out infinite; }
      @keyframes b { 50% { transform: scale(0.86); opacity: 0.6; } }
    </style>
  </head>
  <body>
    <div id="app"><div id="boot"><i></i></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
