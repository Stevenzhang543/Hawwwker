<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Hawwwker 货客：价签外形 = 鹰头（尖端为鹰喙），价签穿孔 = 琥珀色鹰眼 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d7bff"/>
      <stop offset="0.55" stop-color="#6366ff"/>
      <stop offset="1" stop-color="#8a5cff"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ebff"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff9f0a"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1b1f6b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#shine)"/>
  <g transform="scale(16)" filter="url(#drop)">
    <path d="M14 25.5c0-4.4 3.6-8 8-8h17.6c2.2 0 4.2.9 5.7 2.4l8.4 8.6c1.6 1.6 1.6 4.3-.1 5.8-2.6 2.5-5.6 4.3-9 4.9 1.6-2 1.8-3.8.9-5.2L40.2 39c-1.6 2.3-4.2 3.6-7 3.6H22c-4.4 0-8-3.6-8-8z" fill="url(#head)"/>
    <path d="M14 33.5c-2.6 2.8-4.5 6.6-5 11 3.2-2.4 6.8-3.6 10.6-3.8" fill="#ffffff" opacity="0.55"/>
    <circle cx="27" cy="29.6" r="4.6" fill="url(#eye)"/>
    <circle cx="28" cy="29.2" r="2" fill="#121624"/>
    <circle cx="28.7" cy="28.5" r="0.6" fill="#ffffff"/>
  </g>
</svg>
